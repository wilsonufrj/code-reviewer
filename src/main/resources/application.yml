spring:
  application:
    name: code-reviewer
  datasource:
    url: jdbc:postgresql://localhost:5432/codereviewer
    username: postgres
    password: teste123
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

github:
  api-base-url: ${GITHUB_API_BASE_URL:https://api.github.com}
  token: ${GITHUB_TOKEN}
  enabled: ${GITHUB_REVIEWS_ENABLED:false}
  pull-request-monitor:
    enabled: ${GITHUB_PR_MONITOR_ENABLED:false}
    owner: ${GITHUB_PR_MONITOR_OWNER}
    repository: ${GITHUB_PR_MONITOR_REPOSITORY}
    interval-ms: ${GITHUB_PR_MONITOR_INTERVAL_MS:60000}

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    com.codereviewer: INFO
